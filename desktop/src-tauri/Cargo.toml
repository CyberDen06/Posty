[package]
name = "posty-desktop"
version = "0.1.0"
description = "Posty Windows companion: global hotkeys, brain-dump overlay, sidebar widget"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-global-shortcut = "2"
arboard = "3"
enigo = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
